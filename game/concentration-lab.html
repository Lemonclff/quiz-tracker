<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>魔法學園：濃度調配課</title>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&family=Cinzel+Decorative:wght@400;700;900&display=swap');

    :root {
      --bg-deep: #0a0718;
      --bg-card: rgba(30,15,55,0.9);
      --border-magic: #7b5cac;
      --text-primary: #f0e6d2;
      --text-secondary: #d4c5a9;
      --text-muted: #9a8cba;
      --gold: #f5d742;
      --gold-glow: #fae672;
      --purple: #8a4fcf;
      --purple-glow: #b77eff;
      --green: #4caf7c;
      --green-glow: #6ddb9e;
      --red: #c94b4b;
      --red-glow: #e87373;
      --blue: #667eea;
      --cyan: #5bc0be;
      --font-magic: 'Cinzel Decorative', 'Noto Serif TC', serif;
      --font-ui: 'Noto Serif TC', serif;
      --radius-sm: 6px;
      --radius-md: 8px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-ui);
      background: #0a0718;
      background-image:
        radial-gradient(ellipse at 20% 30%, rgba(80,40,140,0.6) 0%, rgba(20,10,45,0.95) 70%),
        radial-gradient(ellipse at 85% 70%, rgba(140,70,200,0.3) 0%, transparent 60%),
        repeating-linear-gradient(45deg, rgba(100,60,180,0.06) 0px, rgba(100,60,180,0.06) 2px, transparent 2px, transparent 8px);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 16px;
      overflow-x: hidden;
      user-select: none;
    }

    .bg-library { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; opacity: 0.3; }
    .bookshelf-left, .bookshelf-right { position: absolute; top: 0; width: 90px; height: 100%; background: repeating-linear-gradient(0deg, #2c1a2c 0px, #2c1a2c 4px, #3e2a3e 4px, #3e2a3e 8px, #2c1a2c 8px, #2c1a2c 32px, #1e0e2a 32px, #1e0e2a 34px, #2c1a2c 34px); opacity: 0.45; }
    .bookshelf-left { left: 0; } .bookshelf-right { right: 0; }

    .starfield { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
    .star { position: absolute; background: rgba(255,240,200,0.8); border-radius: 50%; box-shadow: 0 0 10px 2px rgba(210,180,255,0.6); animation: starTwinkle 4s infinite alternate; }
    @keyframes starTwinkle { 0% { opacity: 0.2; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

    #app { width: 100%; max-width: 720px; margin: 0 auto; position: relative; z-index: 15; }

    .top-bar {
      display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
      margin-bottom: 18px; padding: 14px 20px;
      background: linear-gradient(180deg, rgba(30,15,55,0.85) 0%, rgba(20,8,40,0.95) 100%);
      border: 2px solid var(--border-magic); border-radius: var(--radius-sm); backdrop-filter: blur(2px);
    }
    .top-bar .game-icon { font-size: 30px; filter: drop-shadow(0 0 10px rgba(180,140,220,0.7)); animation: gentleFloat 3s ease-in-out infinite; }
    @keyframes gentleFloat { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-6px); } }
    .top-bar .game-title-text {
      font-family: var(--font-magic); font-size: 20px; font-weight: 900; letter-spacing: 2px;
      color: #ffecb3; text-shadow: 0 0 12px rgba(180,140,220,0.5);
    }
    .top-bar .student-badge {
      font-size: 13px; color: #e0d6c0; background: rgba(90,50,130,0.5);
      border: 1.5px solid rgba(160,140,200,0.4); border-radius: 20px; padding: 5px 14px;
      display: flex; align-items: center; gap: 4px; font-weight: 600;
    }

    .progress-section { margin-bottom: 18px; }
    .level-header {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px;
      flex-wrap: wrap; gap: 8px; background: rgba(25,12,45,0.7);
      border: 2px solid var(--border-magic); border-radius: var(--radius-sm); padding: 10px 16px;
    }
    .level-tag { display: flex; align-items: center; gap: 10px; }
    .level-number {
      font-family: var(--font-magic); font-size: 17px; font-weight: 900;
      color: var(--gold); text-shadow: 0 0 10px rgba(245,215,66,0.4); letter-spacing: 1px;
    }
    .difficulty-badge { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 12px; letter-spacing: 0.5px; }
    .difficulty-badge.easy { background: rgba(76,175,124,0.15); color: var(--green); border: 1px solid rgba(76,175,124,0.35); }
    .difficulty-badge.medium { background: rgba(245,215,66,0.15); color: var(--gold); border: 1px solid rgba(245,215,66,0.35); }
    .difficulty-badge.hard { background: rgba(201,75,75,0.15); color: var(--red); border: 1px solid rgba(201,75,75,0.35); }
    .level-type-tag { font-size: 12px; color: var(--cyan); background: rgba(91,192,190,0.1); border: 1px solid rgba(91,192,190,0.25); border-radius: var(--radius-sm); padding: 3px 10px; font-weight: 600; }
    .question-progress-text { font-size: 13px; color: var(--text-secondary); font-weight: 600; }
    .progress-bar-outer { width: 100%; height: 14px; background: #1a1025; border: 2px solid #5b3d80; border-radius: 7px; overflow: hidden; margin-bottom: 4px; }
    .progress-bar-inner { height: 100%; border-radius: 5px; background: linear-gradient(90deg, #9b4dff, #cc77ff); transition: width 0.5s; box-shadow: 0 0 14px rgba(155,77,255,0.5); }
    .total-progress-label { font-size: 11px; color: var(--text-muted); text-align: right; margin-top: 2px; }

    /* 羊皮紙題目卡片 */
    .question-card {
      background: linear-gradient(180deg, rgba(245,230,202,0.12), rgba(232,213,181,0.08));
      border: 3px solid rgba(196,166,122,0.5); border-radius: var(--radius-lg);
      padding: 28px 24px; margin-bottom: 20px; position: relative; overflow: hidden;
      transition: border-color 0.4s, box-shadow 0.4s; backdrop-filter: blur(1px);
    }
    .question-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, var(--purple), var(--gold), var(--cyan)); opacity: 0.7; }
    .question-card.correct-flash { border-color: var(--green); box-shadow: 0 0 40px rgba(76,175,124,0.35); }
    .question-card.wrong-flash { border-color: var(--red); box-shadow: 0 0 40px rgba(201,75,75,0.35); }
    .question-text { font-size: 18px; line-height: 1.8; margin-bottom: 24px; color: #fff8ed; font-weight: 500; }
    .question-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
    .q-no-badge { font-size: 13px; font-weight: 700; color: var(--purple-glow); background: rgba(138,79,207,0.15); padding: 3px 10px; border-radius: var(--radius-sm); border: 1px solid rgba(138,79,207,0.3); }
    .target-badge { font-size: 12px; color: var(--gold); background: rgba(245,215,66,0.1); border: 1.5px solid rgba(245,215,66,0.3); border-radius: var(--radius-sm); padding: 3px 10px; }

    .options-grid { display: flex; flex-direction: column; gap: 10px; }
    .option-btn {
      display: flex; align-items: center; gap: 14px; width: 100%; padding: 15px 20px;
      font-size: 16px; font-family: var(--font-ui); color: #f0e6d2;
      background: rgba(40,20,65,0.6); border: 2px solid rgba(123,92,172,0.5);
      border-radius: var(--radius-md); cursor: pointer; transition: all 0.2s; text-align: left;
    }
    .option-btn:hover:not(.disabled) { background: rgba(138,79,207,0.2); border-color: var(--purple); box-shadow: 0 0 20px rgba(138,79,207,0.3); transform: translateX(4px); }
    .option-btn .option-letter {
      display: flex; align-items: center; justify-content: center; width: 34px; height: 34px;
      border-radius: 50%; font-weight: 700; font-size: 14px; flex-shrink: 0;
      background: rgba(255,255,255,0.06); border: 1.5px solid rgba(160,140,200,0.3); color: var(--text-secondary); font-family: var(--font-magic);
    }
    .option-btn.correct-choice { background: rgba(76,175,124,0.2) !important; border-color: var(--green) !important; box-shadow: 0 0 25px rgba(76,175,124,0.4) !important; }
    .option-btn.correct-choice .option-letter { background: var(--green); border-color: var(--green); color: #fff; }
    .option-btn.wrong-choice { background: rgba(201,75,75,0.2) !important; border-color: var(--red) !important; box-shadow: 0 0 25px rgba(201,75,75,0.4) !important; }
    .option-btn.wrong-choice .option-letter { background: var(--red); border-color: var(--red); color: #fff; }
    .option-btn.disabled { pointer-events: none; opacity: 0.7; }

    .hint-section { margin-top: 18px; text-align: center; }
    .hint-toggle {
      display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: #d4c5a9;
      background: rgba(30,15,50,0.6); border: 2px dashed rgba(123,92,172,0.5);
      border-radius: 25px; padding: 9px 20px; cursor: pointer; transition: all 0.2s;
      font-family: var(--font-ui); font-weight: 600;
    }
    .hint-toggle:hover { color: var(--purple-glow); border-color: var(--purple); background: rgba(138,79,207,0.15); }
    .hint-toggle.used { color: var(--gold); border-color: var(--gold); background: rgba(245,215,66,0.1); }
    .hint-content {
      margin-top: 12px; padding: 14px 18px; background: rgba(10,5,25,0.85);
      border-left: 6px solid #f5bc70; border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      font-size: 15px; color: #fff0db; line-height: 1.7; display: none;
      animation: fadeInDown 0.3s ease; text-align: left;
    }
    .hint-content.visible { display: block; }
    @keyframes fadeInDown { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: translateY(0); } }

    .feedback-banner { text-align: center; padding: 14px; border-radius: var(--radius-md); font-weight: 700; font-size: 16px; margin-top: 18px; display: none; animation: fadeInDown 0.3s ease; }
    .feedback-banner.show { display: block; }
    .feedback-banner.correct { background: rgba(76,175,124,0.15); border: 2px solid rgba(76,175,124,0.4); color: var(--green-glow); }
    .feedback-banner.wrong { background: rgba(201,75,75,0.15); border: 2px solid rgba(201,75,75,0.4); color: var(--red-glow); }

    /* 羊皮紙遮罩 */
    .full-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; z-index: 1000; animation: fadeIn 0.3s ease; }
    .full-overlay.hidden { display: none; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .overlay-card {
      background: linear-gradient(180deg, #f5e6ca, #e8d5b5); border: 3px solid #c4a67a;
      border-radius: 6px; padding: 36px 28px; text-align: center; max-width: 460px; width: 90%;
      box-shadow: 0 0 70px rgba(255,215,150,0.5); color: #3e2723;
    }
    .overlay-card h2 { font-family: var(--font-magic); font-size: 26px; margin-bottom: 10px; color: #4a148c; letter-spacing: 2px; }
    .overlay-card .overlay-subtitle { font-size: 15px; color: #5d4037; margin-bottom: 24px; line-height: 1.6; }
    .overlay-card input {
      width: 100%; padding: 14px 18px; font-size: 20px; font-family: monospace; letter-spacing: 3px;
      background: #fff9ea; border: 3px solid #7b4da0; border-radius: 40px; color: #3e2723;
      text-align: center; outline: none; transition: border-color 0.2s; margin-bottom: 16px;
    }
    .overlay-card input:focus { border-color: var(--purple); box-shadow: 0 0 15px rgba(138,79,207,0.3); }
    .overlay-card input.error-shake { animation: shake 0.4s ease; border-color: #b71c1c !important; }
    @keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-8px)} 40%{transform:translateX(8px)} 60%{transform:translateX(-6px)} 80%{transform:translateX(6px)} }
    .overlay-card .error-msg { font-size: 14px; color: #b71c1c; font-weight: bold; margin-top: -8px; margin-bottom: 14px; background: rgba(0,0,0,0.08); padding: 6px; border-radius: 20px; display: none; }
    .overlay-card .error-msg.show { display: block; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 13px 30px; font-size: 16px; font-weight: 700; font-family: var(--font-magic); border: none; border-radius: 40px; cursor: pointer; transition: all 0.15s; letter-spacing: 1px; }
    .btn-primary { background: linear-gradient(180deg, #8a4fd0, #5a2a9a); color: #fdf6e3; border: 3px solid #b28eff; box-shadow: 0 0 30px rgba(150,100,240,0.5); }
    .btn-primary:hover { background: linear-gradient(180deg, #a162e6, #7b3bc2); transform: translateY(-2px); box-shadow: 0 0 40px rgba(150,100,240,0.7); }
    .btn-gold { background: linear-gradient(180deg, #5d3a1a, #3e2723); color: #e0c76e; border: 3px solid #8d6e4c; box-shadow: 0 0 25px rgba(200,160,100,0.4); }
    .btn-gold:hover { background: linear-gradient(180deg, #7a4e28, #5d3a1a); transform: translateY(-2px); box-shadow: 0 0 35px rgba(200,160,100,0.6); }
    .btn-sm { padding: 9px 18px; font-size: 14px; }

    .sync-spinner { width: 50px; height: 50px; border: 4px solid rgba(196,166,122,0.3); border-top-color: #8d6e4c; border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 18px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .sync-text { font-size: 17px; color: #5d4037; font-weight: 600; }
    .sync-dots::after { content: ''; animation: dots 1.2s steps(4, end) infinite; }
    @keyframes dots { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} 100%{content:''} }
    .sync-retry-count { font-size: 13px; color: #8d6e4c; margin-top: 8px; }

    .completion-screen { text-align: center; padding: 40px 20px; }
    .completion-screen .trophy { font-size: 64px; margin-bottom: 16px; filter: drop-shadow(0 0 25px rgba(245,215,66,0.6)); }
    .completion-screen h2 { font-family: var(--font-magic); font-size: 30px; color: var(--gold); margin-bottom: 10px; letter-spacing: 2px; text-shadow: 0 0 15px rgba(245,215,66,0.4); }
    .completion-screen .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 14px; margin: 24px 0; }
    .completion-screen .stat-card { background: linear-gradient(180deg, rgba(245,230,202,0.12), rgba(232,213,181,0.06)); border: 2px solid rgba(196,166,122,0.4); border-radius: var(--radius-md); padding: 18px 14px; }
    .completion-screen .stat-value { font-size: 30px; font-weight: 700; color: var(--gold); font-family: var(--font-magic); }
    .completion-screen .stat-label { font-size: 13px; color: var(--text-secondary); margin-top: 6px; }

    @media (max-width: 480px) {
      .top-bar .game-title-text { font-size: 16px; }
      .question-card { padding: 20px 16px; }
      .question-text { font-size: 15px; }
      .option-btn { padding: 12px 14px; font-size: 14px; }
      .overlay-card { padding: 24px 18px; }
      .bookshelf-left, .bookshelf-right { width: 50px; }
    }
  </style>
</head>
<body>

  <!-- 背景裝飾 -->
  <div class="bg-library"><div class="bookshelf-left"></div><div class="bookshelf-right"></div></div>
  <div class="starfield" id="starfield"></div>

  <script>
    (function(){var s=document.getElementById('starfield');for(var i=0;i<45;i++){var t=document.createElement('div');t.className='star';t.style.cssText='left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;width:'+(1+Math.random()*3)+'px;height:'+(1+Math.random()*3)+'px;animation-delay:'+Math.random()*4+'s;animation-duration:'+(2+Math.random()*4)+'s';s.appendChild(t)}})();
  </script>

  <div id="app"></div>

<script>

   ║  部署設定 (請將此網址替換為你的 Google Apps Script URL)    ║
   ╚══════════════════════════════════════════════════════════╝ */
const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby-2kix-lyXoXfplx9WyvDDDl3EPRwyicwFML7uITjT8WH0Yanbqa1qBgAKt3D_0PnbXQ/exec";

/* ╔══════════════════════════════════════════════════════════╗
   ║  localStorage Key 常數                                  ║
   ╚══════════════════════════════════════════════════════════╝ */
const LS_STUDENT_ID   = 'cl_studentId';
const LS_PENDING_Q    = 'cl_pendingQueue';
const LS_GAME_STATE   = 'cl_gameState';

/* ╔══════════════════════════════════════════════════════════╗
   ║  遊戲全域狀態 (STATE)                                    ║
   ╚══════════════════════════════════════════════════════════╝ */
const STATE = {
  studentId:           '',     // e.g. "1C32" (班級+座號)
  currentLevelIdx:     0,      // GAME_SETTING.levels 的索引
  currentQuestionIdx:  0,      // 當前關卡內 questions 的索引
  questionStartTime:   0,      // Date.now() 毫秒
  timerHandle:         null,   // setInterval id
  hintUsedThisQ:       false,  // 當前題目是否用過提示
  isAnswerLocked:      false,  // 防止重複點擊
  totalCorrect:        0,
  totalQuestionsAns:   0,
  // 所有答題的總秒數累計 (用於最終結算)
  totalSecondsSpent:   0
};

/* ╔══════════════════════════════════════════════════════════╗
   ║  工具函式                                                ║
   ╚══════════════════════════════════════════════════════════╝ */
function pad(n) { return String(n).padStart(2, '0'); }

function getTimestamp() {
  const d = new Date();
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}.${String(d.getMilliseconds()).padStart(3,'0')}`;
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

/** 取得總題數 (所有關卡題目相加) */
function getTotalQuestions() {
  return GAME_SETTING.levels.reduce((sum, lv) => sum + lv.questions.length, 0);
}

/** 取得當前關卡物件 */
function getCurrentLevel() {
  return GAME_SETTING.levels[STATE.currentLevelIdx];
}

/** 取得當前題目物件 */
function getCurrentQuestion() {
  return getCurrentLevel().questions[STATE.currentQuestionIdx];
}

/** 計算「已作答」的題數 (到目前關卡的前一關為止 + 當前關卡已答) */        
function getAnsweredCount() {
  let count = 0;
  for (let i = 0; i < STATE.currentLevelIdx; i++) {
    count += GAME_SETTING.levels[i].questions.length;
  }
  count += STATE.currentQuestionIdx; // 當前關卡內已完成的題數 (不含正在作答的這題)
  return count;
}

/** 是當前關卡的最後一題？ */
function isLastQuestionInLevel() {
  return STATE.currentQuestionIdx >= getCurrentLevel().questions.length - 1;
}

/** 是最後一關？ */
function isLastLevel() {
  return STATE.currentLevelIdx >= GAME_SETTING.levels.length - 1;
}

/** localStorage：pending queue */
function getPendingQueue() {
  try {
    const raw = localStorage.getItem(LS_PENDING_Q);
    return raw ? JSON.parse(raw) : [];
  } catch (e) { return []; }
}
function savePendingQueue(queue) {
  localStorage.setItem(LS_PENDING_Q, JSON.stringify(queue));
}
function addToPending(payload) {
  const q = getPendingQueue();
  q.push(payload);
  savePendingQueue(q);
}
function removeFromPending(payload) {
  let q = getPendingQueue();
  // 用 timestamp + questionNo + levelNo 作為唯一識別
  q = q.filter(item =>
    !(item.timestamp === payload.timestamp &&
      item.levelNo === payload.levelNo &&
      item.questionNo === payload.questionNo)
  );
  savePendingQueue(q);
}

/** 難度 -> CSS class */
function difficultyClass(d) {
  if (d === '簡單') return 'easy';
  if (d === '中等') return 'medium';
  return 'hard';
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  計時器管理 (每題獨立計時)                                 ║
   ╚══════════════════════════════════════════════════════════╝ */
function startQuestionTimer() {
  STATE.questionStartTime = Date.now();
  STATE.hintUsedThisQ = false;
}

function stopQuestionTimer() {
  if (STATE.timerHandle) {
    clearInterval(STATE.timerHandle);
    STATE.timerHandle = null;
  }
  const elapsedMs = Date.now() - STATE.questionStartTime;
  return parseFloat((elapsedMs / 1000).toFixed(3)); // 回傳秒數，精確到毫秒
}

/** 取得目前已經過的秒數 (用於即時顯示，不停止計時器) */

}

/* ╔══════════════════════════════════════════════════════════╗
   ║  反丟失同步機制 (Anti-Loss Sync)                          ║
   ║  Payload 由 answer handler 內聯組裝 (12 欄位)             ║
   ╚══════════════════════════════════════════════════════════╝ */

/**
 * 單次 fetch 嘗試
 * @returns {object|null} response JSON 或 null (失敗)
 */
async function trySendPayload(payload) {
  // 若 WEB_APP_URL 仍為佔位文字，跳過真實傳輸（本地測試模式）
  if (!WEB_APP_URL || WEB_APP_URL.includes('在此貼上您的') || WEB_APP_URL.includes('YOUR_')) {
    console.log('[測試模式] 略過真實傳輸:', payload);
    return { status: 'success' };
  }
  try {
    const resp = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });
    if (!resp.ok) return null;
    const data = await resp.json();
    return data;
  } catch (err) {
    console.warn('[Sync] fetch 失敗:', err.message);
    return null;
  }
}

/**
 * 帶重試的傳輸 (最多 5 次，間隔 2 秒)
 * @returns {boolean} 是否成功
 */
async function sendWithRetry(payload, maxRetries = 5, intervalMs = 2000) {
  for (let attempt = 1; attempt <= maxRetries; attempt++) {
    const result = await trySendPayload(payload);
    if (result && result.status === 'success') {
      return true;
    }
    if (attempt < maxRetries) {
      await sleep(intervalMs);
    }
  }
  return false;
}

/**
 * 主要同步流程：
 *  1. localStorage 備份
 *  2. 全螢幕遮罩
 *  3. 重試傳輸
 *  4. 成功 → 清除備份、關遮罩；失敗 → 保留備份、關遮罩、提示
 * @returns {boolean} 傳輸是否成功
 */
async function syncPayload(payload) {
  // 1. 先存入本地 pending 備份
  addToPending(payload);

  // 2. 顯示傳輸遮罩
  showSyncOverlay();

  // 3. 發送 (最多重試 5 次)
  const success = await sendWithRetry(payload, 5, 2000);

  // 4. 處理結果
  if (success) {
    removeFromPending(payload);
    hideSyncOverlay();
    return true;
  } else {
    // 失敗：保留 pending，關遮罩，提示用戶
    hideSyncOverlay();
    alert('⚠️ 網路擁擠，魔法傳輸暫時受阻。\n\n您的答題數據已安全暫存於本地，系統將在後續自動補傳，請放心繼續挑戰！');
    return false;
  }
}

/** 顯示傳輸中遮罩 */
function showSyncOverlay() {
  let overlay = document.getElementById('sync-overlay');
  if (!overlay) {
    overlay = document.createElement('div');
    overlay.id = 'sync-overlay';
    overlay.className = 'full-overlay';
    overlay.innerHTML = `
      <div class="overlay-card">
        <div class="sync-spinner"></div>
        <p class="sync-text">🪄 魔法傳輸中<span class="sync-dots"></span></p>
        <p class="sync-retry-count" id="sync-retry-msg"></p>
      </div>`;
    document.body.appendChild(overlay);
  }
  overlay.classList.remove('hidden');
}
function hideSyncOverlay() {
  const overlay = document.getElementById('sync-overlay');
  if (overlay) overlay.classList.add('hidden');
}

/**
 * 背景補傳 pending queue（在關卡初始化時靜默執行）
 */
async function flushPendingQueue() {
  const queue = getPendingQueue();
  if (queue.length === 0) return;

  console.log(`[Sync] 背景補傳 ${queue.length} 筆 pending 資料...`);
  const toRemove = [];
  for (const item of queue) {
    const ok = await sendWithRetry(item, 3, 2000);
    if (ok) toRemove.push(item);
  }
  if (toRemove.length > 0) {
    const remaining = queue.filter(item =>
      !toRemove.some(r =>
        r.timestamp === item.timestamp &&
        r.levelNo === item.levelNo &&
        r.questionNo === item.questionNo
      )
    );
    savePendingQueue(remaining);
    console.log(`[Sync] 補傳成功 ${toRemove.length} 筆，剩餘 ${remaining.length} 筆`);
  }
}

function showLoginScreen() {

        <button class="btn btn-gold" id="login-btn">🏰 進入魔法學園</button>
      </div>
    </div>`;

  const input   = document.getElementById('login-input');
  const btn     = document.getElementById('login-btn');
  const errEl   = document.getElementById('login-error');

  function doLogin() {
    const val = input.value.trim().toUpperCase();
    // 驗證格式：數字 + 一個英文字母（班級） + 數字（座號），如 1C32
    if (!/^\d+[A-Z]\d+$/.test(val)) {
      input.classList.add('error-shake');

      setTimeout(() => {

    if (overlay) overlay.remove();

    initGame();
  }

  btn.addEventListener('click', doLogin);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

}

  overlay.className = 'full-overlay';
  overlay.innerHTML = `
    <div class="overlay-card">

      </p>

             placeholder="請輸入關卡密碼"
             autocomplete="off" maxlength="30">
      <p class="error-msg" id="pw-error">🔮 密碼不正確，請再試一次！</p>
      <button class="btn btn-gold" id="pw-submit">✨ 解鎖下一關</button>
    </div>`;
  document.body.appendChild(overlay);

  const input  = document.getElementById('pw-input');
  const btn    = document.getElementById('pw-submit');
  const errEl  = document.getElementById('pw-error');

  function checkPassword() {
    const val = input.value.trim();
    if (val === lv.nextLevelPassword) {
      // 密碼正確
      overlay.remove();
      advanceToNextLevel();
    } else {
      input.classList.add('error-shake');
      errEl.classList.add('show');
      setTimeout(() => {
        input.classList.remove('error-shake');
        errEl.classList.remove('show');
      }, 800);
    }
  }

  btn.addEventListener('click', checkPassword);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') checkPassword(); });
  input.focus();
}

  flushPendingQueue();
  renderGameScreen();
}

function advanceToNextQuestion() {

}

function restartGame() {
  STATE.currentLevelIdx     = 0;
  STATE.currentQuestionIdx  = 0;
  STATE.totalCorrect        = 0;
  STATE.totalQuestionsAns   = 0;
  STATE.totalSecondsSpent   = 0;
  STATE.isAnswerLocked      = false;
  clearApp();
  renderGameScreen();
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  選項點擊事件                                            ║
   ╚══════════════════════════════════════════════════════════╝ */
function bindOptionEvents() {
  const q = getCurrentQuestion();
  const buttons = document.querySelectorAll('.option-btn');

  buttons.forEach((btn, idx) => {
    btn.addEventListener('click', async () => {
      if (STATE.isAnswerLocked) return;
      STATE.isAnswerLocked = true;

      // 停止計時，取得花費秒數
      const secondsTaken = stopQuestionTimer();
      STATE.totalSecondsSpent += secondsTaken;

      const isCorrect = (idx === q.correctIndex);
      if (isCorrect) STATE.totalCorrect++;
      STATE.totalQuestionsAns++;

      // 視覺回饋：標記正確/錯誤選項
      buttons.forEach((b, i) => {
        b.classList.add('disabled');
        if (i === q.correctIndex) {
          b.classList.add('correct-choice');
        }
      });
      if (!isCorrect) {
        btn.classList.add('wrong-choice');
      }

      // 顯示回饋橫幅
      const feedbackBanner = document.getElementById('feedback-banner');
      const questionCard   = document.getElementById('question-card');
      if (isCorrect) {
        feedbackBanner.className = 'feedback-banner correct show';
        feedbackBanner.textContent = '✅ 答對了！魔法藥水調配成功！';
        questionCard.classList.add('correct-flash');
      } else {
        feedbackBanner.className = 'feedback-banner wrong show';
        feedbackBanner.textContent = `❌ 答錯了！正確答案是「${q.options[q.correctIndex]}」`;
        questionCard.classList.add('wrong-flash');
      }

      // 組裝 payload
      const payload = {
        timestamp:   getTimestamp(),
        studentId:   STATE.studentId,
        gameTitle:   GAME_SETTING.gameTitle,
        levelNo:     getCurrentLevel().levelNo,
        questionNo:  q.questionNo,
        difficulty:  getCurrentLevel().difficulty,
        levelType:   getCurrentLevel().levelType,
        target:      q.target,
        chosen:      q.options[idx],   // 學生實際點選的選項
        isCorrect:   isCorrect,
        timeTaken:   secondsTaken,
        hintUsed:    STATE.hintUsedThisQ
      };

      // 等待 1.2 秒讓學生看清楚回饋
      await sleep(1200);

      // 執行反丟失同步傳輸
      const syncOk = await syncPayload(payload);

      // 決定下一步
      STATE.isAnswerLocked = false;

      if (isLastQuestionInLevel()) {
        if (isLastLevel()) {
          // 最後一關的最後一題 → 結算畫面
          showCompletionScreen();
        } else {
          // 還有下一關 → 密碼驗證
          showPasswordGate();
        }
      } else {
        // 同一關還有下一題 → 直接前進
        advanceToNextQuestion();
      }
    });
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  提示按鈕事件                                            ║
   ╚══════════════════════════════════════════════════════════╝ */
function bindHintEvents() {
  const toggle = document.getElementById('hint-toggle');
  const content = document.getElementById('hint-content');
  if (!toggle || !content) return;

  toggle.addEventListener('click', () => {
    const isVisible = content.classList.contains('visible');
    if (isVisible) {
      content.classList.remove('visible');
      toggle.innerHTML = '💡 顯示魔法提示';
    } else {
      content.classList.add('visible');
      STATE.hintUsedThisQ = true;
      toggle.classList.add('used');
      toggle.innerHTML = '🔮 魔法提示已揭示';
    }
  });
}

/* ╔══════════════════════════════════════════════════════════╗
   ║  遊戲初始化入口                                          ║
   ╚══════════════════════════════════════════════════════════╝ */
function initGame() {
  // 嘗試恢復遊戲進度
  const savedState = localStorage.getItem(LS_GAME_STATE);
  if (savedState) {
    try {
      const parsed = JSON.parse(savedState);
      STATE.currentLevelIdx    = parsed.currentLevelIdx    || 0;
      STATE.currentQuestionIdx = parsed.currentQuestionIdx || 0;
      STATE.totalCorrect       = parsed.totalCorrect       || 0;
      STATE.totalSecondsSpent  = parsed.totalSecondsSpent  || 0;
    } catch (e) { /* ignore */ }
  }

  // 背景補傳 pending 資料
  flushPendingQueue();

  renderGameScreen();
}

// 定時儲存遊戲進度（每 5 秒）
setInterval(() => {
  if (STATE.studentId) {
    localStorage.setItem(LS_GAME_STATE, JSON.stringify({
      currentLevelIdx:    STATE.currentLevelIdx,
      currentQuestionIdx: STATE.currentQuestionIdx,
      totalCorrect:       STATE.totalCorrect,
      totalSecondsSpent:  STATE.totalSecondsSpent
    }));
  }
}, 5000);

/* ╔══════════════════════════════════════════════════════════╗
   ║  啟動：檢查登入狀態                                       ║
   ╚══════════════════════════════════════════════════════════╝ */
(function bootstrap() {
  const savedId = localStorage.getItem(LS_STUDENT_ID);
  if (savedId) {
    STATE.studentId = savedId;
    initGame();
  } else {
    showLoginScreen();
  }
})();
</script>

// ═══════════════════════════════════════════════════════════════════
// GAS 程式碼開始 (請複製以下所有內容)
// ═══════════════════════════════════════════════════════════════════

// ---- 設定區 ----
var CONFIG = {
  sheetName: '學習紀錄',           // Google Sheet 工作表名稱
  jsonFileName: 'all_students_logs.json',  // Drive JSON 檔案名稱
  folderName: '魔法學園_數據備份'    // Drive 資料夾名稱（若不存在會自動建立）
};

// ═══════════════════════════════════════════════════════════════════
// doPost(e) — 網頁應用程式唯一入口，接收前端 POST 請求
// ═══════════════════════════════════════════════════════════════════
function doPost(e) {
  try {
    // 1. 解析前端傳來的 12 欄位 JSON
    var payload = JSON.parse(e.postData.contents);

    // 2. 雙路同步儲存
    appendToSheet(payload);      // 路徑 A：即時寫入試算表
    appendToDriveJson(payload);  // 路徑 B：累積寫入雲端 JSON

    // 3. 回傳成功訊號給前端
    return ContentService
      .createTextOutput(JSON.stringify({ status: 'success' }))
      .setMimeType(ContentService.MimeType.JSON);

  } catch (err) {
    // 4. 錯誤處理：回傳失敗原因
    return ContentService
      .createTextOutput(JSON.stringify({
        status: 'error',
        message: err.toString()
      }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

// ═══════════════════════════════════════════════════════════════════
// doGet(e) — CORS 預檢與健康檢查
// ═══════════════════════════════════════════════════════════════════
function doGet(e) {
  return ContentService
    .createTextOutput(JSON.stringify({
      status: 'ok',
      message: '魔法學園 API 運作中',
      timestamp: new Date().toISOString()
    }))
    .setMimeType(ContentService.MimeType.JSON);
}

// ═══════════════════════════════════════════════════════════════════
// 路徑 A：即時追加到 Google 試算表 (appendRow)
// 試算表欄位順序與前端 payload 12 欄位完全一致
// ═══════════════════════════════════════════════════════════════════
function appendToSheet(data) {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(CONFIG.sheetName);

  // 若工作表不存在，自動建立並寫入標題列
  if (!sheet) {
    sheet = SpreadsheetApp.getActiveSpreadsheet().insertSheet(CONFIG.sheetName);
    sheet.appendRow([
      'timestamp', 'studentId', 'gameTitle', 'levelNo', 'questionNo',
      'difficulty', 'levelType', 'target', 'chosen', 'isCorrect',
      'timeTaken', 'hintUsed'
    ]);
  }

  // 檢查是否需要寫入標題列 (工作表為空的情況)
  if (sheet.getLastRow() === 0) {
    sheet.appendRow([
      'timestamp', 'studentId', 'gameTitle', 'levelNo', 'questionNo',
      'difficulty', 'levelType', 'target', 'chosen', 'isCorrect',
      'timeTaken', 'hintUsed'
    ]);
  }

  // 追加一列數據
  sheet.appendRow([
    data.timestamp   || '',
    data.studentId   || '',
    data.gameTitle   || '',
    data.levelNo     || '',
    data.questionNo  || '',
    data.difficulty  || '',
    data.levelType   || '',
    data.target      || '',
    data.chosen      || '',
    data.isCorrect   || false,
    data.timeTaken   || 0,
    data.hintUsed    || false
  ]);

  // 自動排序：依時間由新到舊（第二欄 timestamp）
  autoSortSheet(sheet);
}

// ═══════════════════════════════════════════════════════════════════
// 路徑 B：自動寫入雲端 JSON 檔案 (DriveApp) — 陣列追加，不覆蓋舊資料
// ═══════════════════════════════════════════════════════════════════
function appendToDriveJson(data) {
  var folder = getOrCreateFolder(CONFIG.folderName);
  var file   = getOrCreateJsonFile(folder, CONFIG.jsonFileName);

  // 讀取現有 JSON 內容
  var existingContent = file.getBlob().getDataAsString();
  var records = [];

  if (existingContent && existingContent.trim() !== '') {
    try {
      records = JSON.parse(existingContent);
      if (!Array.isArray(records)) records = [];
    } catch (parseErr) {
      // JSON 格式損壞 → 重建空陣列
      console.warn('JSON 解析失敗，重建檔案: ' + parseErr.toString());
      records = [];
    }
  }

  // 將新數據追加到陣列中
  records.push({
    timestamp:  data.timestamp  || '',
    studentId:  data.studentId  || '',
    gameTitle:  data.gameTitle  || '',
    levelNo:    data.levelNo    || '',
    questionNo: data.questionNo || '',
    difficulty: data.difficulty || '',
    levelType:  data.levelType  || '',
    target:     data.target     || '',
    chosen:     data.chosen     || '',
    isCorrect:  data.isCorrect  || false,
    timeTaken:  data.timeTaken  || 0,
    hintUsed:   data.hintUsed   || false,
    _receivedAt: new Date().toISOString()  // 伺服器接收時間戳
  });

  // 覆寫整個 JSON 檔案（保持完整歷史紀錄）
  file.setContent(JSON.stringify(records, null, 2));
}

// ═══════════════════════════════════════════════════════════════════
// 輔助函式：取得或建立 Google Drive 資料夾
// ═══════════════════════════════════════════════════════════════════
function getOrCreateFolder(folderName) {
  var folders = DriveApp.getFoldersByName(folderName);
  if (folders.hasNext()) {
    return folders.next();
  }
  // 建立在根目錄
  return DriveApp.createFolder(folderName);
}

// ═══════════════════════════════════════════════════════════════════
// 輔助函式：在指定資料夾中取得或建立 JSON 檔案
// ═══════════════════════════════════════════════════════════════════
function getOrCreateJsonFile(folder, fileName) {
  var files = folder.getFilesByName(fileName);
  if (files.hasNext()) {
    return files.next();
  }
  // 建立新檔案，初始內容為空陣列
  return folder.createFile(fileName, '[]', 'application/json');
}

// ═══════════════════════════════════════════════════════════════════
// 輔助函式：自動排序試算表（依 timestamp 欄位由新到舊）
// ═══════════════════════════════════════════════════════════════════
function autoSortSheet(sheet) {
  var lastRow = sheet.getLastRow();
  if (lastRow <= 2) return; // 只有標題 + 1 筆資料，無需排序
  var range = sheet.getRange(2, 1, lastRow - 1, 12);
  range.sort({ column: 1, ascending: false }); // 依第 1 欄 (timestamp) 降序排列
}

// ═══════════════════════════════════════════════════════════════════
// 可選功能：清除所有測試資料（手動在 GAS 編輯器中執行此函式）
// ═══════════════════════════════════════════════════════════════════
function clearAllData() {
  var sheet = SpreadsheetApp.getActiveSpreadsheet().getSheetByName(CONFIG.sheetName);
  if (sheet) {
    var lastRow = sheet.getLastRow();
    if (lastRow > 1) {
      sheet.getRange(2, 1, lastRow - 1, 12).clearContent();
    }
  }
  // 同時清除 JSON 備份
  var folder = getOrCreateFolder(CONFIG.folderName);
  var file   = getOrCreateJsonFile(folder, CONFIG.jsonFileName);
  file.setContent('[]');
  Logger.log('所有數據已清除');
}

// ═══════════════════════════════════════════════════════════════════
