<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>魔法學園 — 濃度大挑戰</title>
  <style>
    :root {
      --bg: #0f0f1a;
      --card: #1a1a2e;
      --border: #2a2a4a;
      --text: #e0e0f0;
      --muted: #8888aa;
      --accent: #7c5ce7;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --info: #3b82f6;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }
    .container {
      max-width: 640px;
      width: 100%;
    }

    /* Header */
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      font-size: 28px;
      background: linear-gradient(135deg, #7c5ce7, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .header .subtitle {
      font-size: 13px;
      color: var(--muted);
    }

    /* Status bar */
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px 20px;
      margin-bottom: 16px;
      font-size: 14px;
    }
    .status-item { display: flex; align-items: center; gap: 6px; }
    .status-label { color: var(--muted); font-size: 11px; }
    .status-value { font-weight: 600; }
    .status-value.score { color: var(--accent); }
    .status-value.timer { color: var(--warning); font-variant-numeric: tabular-nums; }
    .status-value.timer.urgent { color: var(--danger); animation: pulse 0.5s infinite; }
    @keyframes pulse { 50% { opacity: 0.5; } }

    /* Card */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 28px;
      margin-bottom: 16px;
    }
    .card h2 {
      font-size: 18px;
      margin-bottom: 8px;
    }
    .target-display {
      text-align: center;
      padding: 24px;
      margin: 16px 0;
      background: linear-gradient(135deg, rgba(124,92,231,0.1), rgba(167,139,250,0.05));
      border: 2px dashed var(--accent);
      border-radius: 16px;
    }
    .target-display .label {
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 8px;
    }
    .target-display .value {
      font-size: 48px;
      font-weight: 800;
      color: var(--accent);
    }

    /* Answer grid */
    .answer-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 16px;
    }
    .answer-btn {
      padding: 16px;
      border: 2px solid var(--border);
      border-radius: 14px;
      background: rgba(255,255,255,0.03);
      color: var(--text);
      font-size: 16px;
      cursor: pointer;
      transition: all 0.15s;
      text-align: center;
      font-weight: 500;
    }
    .answer-btn:hover {
      border-color: var(--accent);
      background: rgba(124,92,231,0.1);
    }
    .answer-btn.selected {
      border-color: var(--accent);
      background: rgba(124,92,231,0.2);
    }
    .answer-btn.correct {
      border-color: var(--success) !important;
      background: rgba(34,197,94,0.15) !important;
    }
    .answer-btn.wrong {
      border-color: var(--danger) !important;
      background: rgba(239,68,68,0.15) !important;
    }
    .answer-btn:disabled { opacity: 0.6; cursor: not-allowed; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 12px 24px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-primary { background: var(--accent); color: white; }
    .btn-primary:hover { opacity: 0.9; }
    .btn-secondary { background: var(--border); color: var(--text); }
    .btn-sm { padding: 8px 16px; font-size: 12px; }
    .btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .btn-row { display: flex; gap: 10px; justify-content: center; margin-top: 16px; }

    /* Feedback */
    .feedback {
      text-align: center;
      padding: 12px;
      border-radius: 12px;
      margin-top: 12px;
      font-size: 15px;
      font-weight: 600;
      display: none;
    }
    .feedback.show { display: block; }
    .feedback.correct { background: rgba(34,197,94,0.1); color: var(--success); }
    .feedback.wrong { background: rgba(239,68,68,0.1); color: var(--danger); }

    /* Hint */
    .hint-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      background: rgba(245,158,11,0.15);
      color: var(--warning);
    }

    /* Level complete */
    .complete-card {
      text-align: center;
      padding: 40px 20px;
    }
    .complete-card .emoji { font-size: 56px; margin-bottom: 12px; }
    .complete-card h2 { margin-bottom: 8px; }
    .complete-card .stats { color: var(--muted); margin-bottom: 20px; }

    /* Debug log (可隱藏) */
    .debug-log {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
      margin-top: 16px;
      max-height: 120px;
      overflow-y: auto;
      font-size: 11px;
      color: var(--muted);
      font-family: monospace;
      display: none;
    }
    .debug-log.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>🧪 魔法學園 — 濃度大挑戰</h1>
    <p class="subtitle" id="studentLabel">尚未輸入座號</p>
  </div>

  <div class="status-bar">
    <div class="status-item">
      <span class="status-label">關卡</span>
      <span class="status-value" id="levelDisplay">1</span>
    </div>
    <div class="status-item">
      <span class="status-label">分數</span>
      <span class="status-value score" id="scoreDisplay">0</span>
    </div>
    <div class="status-item">
      <span class="status-label">⏱</span>
      <span class="status-value timer" id="timerDisplay">30</span>
    </div>
    <div class="status-item">
      <span id="hintBadge" class="hint-badge" style="display:none">💡 提示已使用</span>
    </div>
  </div>

  <!-- 遊戲區 -->
  <div class="card" id="gameArea">
    <h2 id="questionTitle">請選出代表以下目標濃度的圖示</h2>
    <div class="target-display">
      <div class="label">目標濃度</div>
      <div class="value" id="targetValue">30%</div>
    </div>
    <div class="answer-grid" id="answerGrid"></div>
    <div class="feedback" id="feedback"></div>
    <div class="btn-row">
      <button class="btn btn-sm btn-secondary" id="hintBtn" disabled>💡 使用提示</button>
      <button class="btn btn-primary" id="nextBtn" style="display:none">下一題 ▶</button>
    </div>
  </div>

  <!-- 完成畫面 (隱藏) -->
  <div class="card complete-card" id="completeArea" style="display:none">
    <div class="emoji">🎉</div>
    <h2>關卡完成！</h2>
    <p class="stats" id="completeStats"></p>
    <button class="btn btn-primary" onclick="nextLevel()">下一關 ▶</button>
  </div>

  <!-- Debug log -->
  <div class="debug-log show" id="debugLog"></div>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// 設定區 — 部署後只要改這個網址
// ═══════════════════════════════════════════════════════════
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyNqd4ZNZAAvadvtVf3gm2pF81QVuZ0H5L_vElQYNup69AAe98mSNvTAJK6Y6X5NszNsQ/exec";

// ═══════════════════════════════════════════════════════════
// 遊戲狀態
// ═══════════════════════════════════════════════════════════
const state = {
  studentId: localStorage.getItem("studentId") || "",
  level: 1,
  score: 0,
  questionIndex: 0,
  questionsPerLevel: 5,
  currentQuestion: null,
  selectedAnswer: null,
  timeLeft: 30,
  patienceTimeLimit: 30,
  hintUsed: false,
  timerInterval: null,
  answered: false,
};

// ═══════════════════════════════════════════════════════════
// 題庫
// ═══════════════════════════════════════════════════════════

const QUESTION_POOLS = {
  // 關卡 1：百分數
  1: [
    { target: "30%", type: "百分數", answers: ["30/100", "3/10", "3/100", "30/10"], correct: 0 },
    { target: "50%", type: "百分數", answers: ["1/2", "5/10", "1/5", "5/2"], correct: 0 },
    { target: "75%", type: "百分數", answers: ["75/100", "3/4", "7/10", "75/10"], correct: 0 },
    { target: "20%", type: "百分數", answers: ["1/5", "20/100", "2/5", "2/100"], correct: 0 },
    { target: "10%", type: "百分數", answers: ["10/100", "1/10", "1/100", "10/10"], correct: 0 },
    { target: "60%", type: "百分數", answers: ["3/5", "60/100", "6/10", "3/100"], correct: 0 },
    { target: "90%", type: "百分數", answers: ["9/10", "90/100", "9/100", "90/10"], correct: 0 },
    { target: "25%", type: "百分數", answers: ["1/4", "25/100", "2/5", "25/10"], correct: 0 },
  ],
  // 關卡 2：分數
  2: [
    { target: "1/2", type: "分數", answers: ["50/100", "2/4", "3/6", "1/3"], correct: 0 },
    { target: "3/4", type: "分數", answers: ["75/100", "6/8", "7/10", "3/5"], correct: 0 },
    { target: "1/4", type: "分數", answers: ["25/100", "2/8", "1/3", "2/5"], correct: 0 },
    { target: "2/5", type: "分數", answers: ["40/100", "4/10", "3/5", "2/10"], correct: 0 },
    { target: "4/5", type: "分數", answers: ["80/100", "8/10", "4/10", "5/4"], correct: 0 },
    { target: "1/5", type: "分數", answers: ["20/100", "2/10", "1/6", "5/10"], correct: 0 },
    { target: "3/5", type: "分數", answers: ["60/100", "6/10", "3/10", "5/3"], correct: 0 },
    { target: "1/10", type: "分數", answers: ["10/100", "1/4", "10/10", "1/100"], correct: 0 },
  ],
  // 關卡 3：小數
  3: [
    { target: "0.5", type: "小數", answers: ["50/100", "1/2", "0.05", "5/100"], correct: 0 },
    { target: "0.25", type: "小數", answers: ["25/100", "1/4", "0.025", "2/5"], correct: 0 },
    { target: "0.75", type: "小數", answers: ["75/100", "3/4", "0.075", "7/10"], correct: 0 },
    { target: "0.1", type: "小數", answers: ["10/100", "1/10", "0.01", "1/100"], correct: 0 },
    { target: "0.3", type: "小數", answers: ["30/100", "3/10", "0.03", "3/100"], correct: 0 },
    { target: "0.8", type: "小數", answers: ["80/100", "4/5", "0.08", "8/10"], correct: 0 },
    { target: "0.6", type: "小數", answers: ["60/100", "3/5", "0.06", "6/10"], correct: 0 },
    { target: "0.2", type: "小數", answers: ["20/100", "1/5", "0.02", "2/100"], correct: 0 },
  ],
};

// ═══════════════════════════════════════════════════════════
// 初始化
// ═══════════════════════════════════════════════════════════

function init() {
  if (!state.studentId) {
    state.studentId = prompt("請輸入你的座號（例如 01 或 王小明）");
    if (!state.studentId) state.studentId = "unknown";
    localStorage.setItem("studentId", state.studentId);
  }
  document.getElementById("studentLabel").textContent = `學生：${state.studentId}`;
  loadQuestion();
}

// ═══════════════════════════════════════════════════════════
// 載入題目
// ═══════════════════════════════════════════════════════════

function loadQuestion() {
  const pool = QUESTION_POOLS[state.level] || QUESTION_POOLS[1];
  const q = pool[state.questionIndex % pool.length];
  state.currentQuestion = q;
  state.selectedAnswer = null;
  state.hintUsed = false;
  state.answered = false;
  state.timeLeft = state.patienceTimeLimit;

  // UI
  document.getElementById("targetValue").textContent = q.target;
  document.getElementById("levelDisplay").textContent = state.level;
  document.getElementById("hintBadge").style.display = "none";
  document.getElementById("feedback").className = "feedback";
  document.getElementById("feedback").textContent = "";
  document.getElementById("nextBtn").style.display = "none";
  document.getElementById("hintBtn").disabled = false;
  document.getElementById("gameArea").style.display = "block";
  document.getElementById("completeArea").style.display = "none";

  const grid = document.getElementById("answerGrid");
  grid.innerHTML = "";
  q.answers.forEach((ans, i) => {
    const btn = document.createElement("button");
    btn.className = "answer-btn";
    btn.textContent = ans;
    btn.onclick = () => selectAnswer(i);
    grid.appendChild(btn);
  });

  startTimer();
}

// ═══════════════════════════════════════════════════════════
// 計時器
// ═══════════════════════════════════════════════════════════

function startTimer() {
  clearInterval(state.timerInterval);
  updateTimerDisplay();
  state.timerInterval = setInterval(() => {
    state.timeLeft = Math.max(0, state.timeLeft - 0.1);
    updateTimerDisplay();
    if (state.timeLeft <= 0 && !state.answered) {
      timeUp();
    }
  }, 100);
}

function updateTimerDisplay() {
  const el = document.getElementById("timerDisplay");
  el.textContent = state.timeLeft.toFixed(1);
  el.className = "status-value timer" + (state.timeLeft <= 10 ? " urgent" : "");
}

function timeUp() {
  clearInterval(state.timerInterval);
  checkAnswer(null); // 逾時視為答錯
}

// ═══════════════════════════════════════════════════════════
// 選擇答案
// ═══════════════════════════════════════════════════════════

function selectAnswer(index) {
  if (state.answered) return;
  state.selectedAnswer = index;
  state.answered = true;
  clearInterval(state.timerInterval);

  // UI 標記
  const buttons = document.querySelectorAll(".answer-btn");
  buttons.forEach((btn, i) => {
    btn.disabled = true;
    if (i === state.currentQuestion.correct) btn.classList.add("correct");
    else if (i === index && index !== state.currentQuestion.correct) btn.classList.add("wrong");
    else if (i === index && index === state.currentQuestion.correct) btn.classList.add("correct");
  });

  checkAnswer(index);
}

// ═══════════════════════════════════════════════════════════
// 檢查答案 + 紀錄
// ═══════════════════════════════════════════════════════════

function checkAnswer(index) {
  const q = state.currentQuestion;
  const correct = index === q.correct;
  const elapsed = (state.patienceTimeLimit - state.timeLeft).toFixed(1);
  const chosen = index !== null ? q.answers[index] : "逾時";

  // 分數
  if (correct) state.score += 10;

  // 反饋
  const fb = document.getElementById("feedback");
  fb.className = "feedback show " + (correct ? "correct" : "wrong");
  fb.textContent = correct
    ? `✅ 正確！+10 分（用時 ${elapsed} 秒）`
    : `❌ 錯誤！正確答案是 ${q.answers[q.correct]}（用時 ${elapsed} 秒）`;

  document.getElementById("scoreDisplay").textContent = state.score;
  document.getElementById("nextBtn").style.display = "inline-flex";

  // 送出資料到 Google Sheets
  const entry = {
    studentId: state.studentId,
    timestamp: new Date().toLocaleString("zh-TW", { timeZone: "Asia/Taipei" }),
    level: String(state.level),
    type: q.type,
    target: q.target,
    correct: correct ? "✅" : "❌",
    chosen: chosen,
    time: elapsed,
    hintUsed: state.hintUsed ? "是" : "否",
  };
  sendToSheet(entry);
  debugLog(`📤 送出：${JSON.stringify(entry)}`);
}

// ═══════════════════════════════════════════════════════════
// 傳送資料到 Google Apps Script
// ═══════════════════════════════════════════════════════════

function sendToSheet(entry) {
  fetch(SCRIPT_URL, {
    method: "POST",
    headers: { "Content-Type": "text/plain;charset=utf-8" },
    body: JSON.stringify(entry),
  })
    .then((r) => r.text())
    .then((txt) => debugLog("✅ Sheets 回應：" + txt))
    .catch((err) => debugLog("❌ 傳送失敗：" + err));
}

// ═══════════════════════════════════════════════════════════
// 提示
// ═══════════════════════════════════════════════════════════

document.getElementById("hintBtn").onclick = () => {
  if (state.hintUsed) return;
  state.hintUsed = true;
  document.getElementById("hintBtn").disabled = true;
  document.getElementById("hintBadge").style.display = "inline-flex";
  scorePenalty(2);
  // 移除兩個錯誤選項
  const buttons = document.querySelectorAll(".answer-btn");
  let removed = 0;
  buttons.forEach((btn, i) => {
    if (i !== state.currentQuestion.correct && removed < 2) {
      btn.style.opacity = "0.15";
      btn.style.pointerEvents = "none";
      removed++;
    }
  });
};

function scorePenalty(n) {
  state.score = Math.max(0, state.score - n);
  document.getElementById("scoreDisplay").textContent = state.score;
}

// ═══════════════════════════════════════════════════════════
// 下一題
// ═══════════════════════════════════════════════════════════

document.getElementById("nextBtn").onclick = () => {
  state.questionIndex++;
  if (state.questionIndex >= state.questionsPerLevel) {
    completeLevel();
  } else {
    loadQuestion();
  }
};

// ═══════════════════════════════════════════════════════════
// 關卡完成
// ═══════════════════════════════════════════════════════════

function completeLevel() {
  clearInterval(state.timerInterval);
  document.getElementById("gameArea").style.display = "none";
  document.getElementById("completeArea").style.display = "block";
  document.getElementById("completeStats").textContent =
    `第 ${state.level} 關完成！得分：${state.score} 分`;
}

function nextLevel() {
  if (state.level >= 3) {
    alert("🎉 恭喜完成所有關卡！");
    state.level = 1;
    state.score = 0;
    state.questionIndex = 0;
    document.getElementById("scoreDisplay").textContent = "0";
    document.getElementById("completeArea").style.display = "none";
    loadQuestion();
    return;
  }
  state.level++;
  state.questionIndex = 0;
  document.getElementById("levelDisplay").textContent = state.level;
  document.getElementById("completeArea").style.display = "none";
  loadQuestion();
}

// ═══════════════════════════════════════════════════════════
// Debug
// ═══════════════════════════════════════════════════════════

function debugLog(msg) {
  const log = document.getElementById("debugLog");
  log.innerHTML += `<div>${new Date().toLocaleTimeString()} ${msg}</div>`;
  log.scrollTop = log.scrollHeight;
}

// ═══════════════════════════════════════════════════════════
// 啟動
// ═══════════════════════════════════════════════════════════

init();
debugLog("🚀 遊戲已啟動，請開始答題");
</script>
</body>
</html>
